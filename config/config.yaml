# MazeBench 配置文件
# 支持环境变量覆盖，优先级：环境变量 > local.yaml > config.yaml

# 模型配置
model: "gpt-4"  # 使用的模型名称
temperature: 0.0  # 模型生成温度参数，控制随机性 (0.0-2.0)
OPENAI_API_KEY: null  # OpenAI API密钥，可通过环境变量设置
OPENAI_API_BASE: null  # OpenAI API基础URL，可选

# Azure OpenAI配置（可选）
# PROVIDER: "azure"
# AZURE_OPENAI_API_KEY: null
# AZURE_OPENAI_ENDPOINT: null
# AZURE_OPENAI_DEPLOYMENT: null
# AZURE_OPENAI_API_VERSION: "2023-12-01-preview"

# 评测模式
mode: "text2d"  # text2d 或 image2d

# 数据路径

output_dir: "outputs_15x15/"  # 结果输出文件夹 
# 迷宫生成配置
generate_mazes: False  # 是否生成新的迷宫数据
mazes_path: "mazes/"  # 迷宫数据路径（JSON/YAML文件或目录）如果不生成新的迷宫
# 注意，测试时会使用目录中的所有迷宫
maze_output_dir: "mazes_15x15/"  # 迷宫生成输出目录 如果生成新的迷宫
maze_count: 5  # 生成的迷宫数量
run_evaluation: True  # 是否运行评测（设置为False可以只生成迷宫，不进行测试）

# 文本迷宫配置
# 如果不生成新的迷宫，则下面的配置都无效，评测会使用mazes_path路径下的迷宫数据
text2d:
  size: "15x15"  # 迷宫尺寸 (height x width)
  seed: 42  # 随机种子
  start_goal: "corner"  # 起点终点位置: "corner" 或 "random"
  algorithm: "dfs"  # 生成算法: "dfs" 或 "prim"

# 图片迷宫配置
image2d:
  size: "9x9"  # 迷宫尺寸 (height x width)
  seed: 42  # 随机种子
  start_goal: "corner"  # 起点终点位置: "corner" 或 "random"
  algorithm: "dfs"  # 生成算法: "dfs" 或 "prim"
  cell_px: 24  # 每个单元格的像素大小

# 其他配置
log_level: "INFO"  # 日志级别
log_file: "outputs/mazebench.log"  # 日志文件路径，可选

# AI沙盒配置
sandbox:
  enabled: true  # 启用AI沙盒测试
  max_steps: 50  # AI测试最大步数
  memory: 10  # AI记忆长度（最近k次动作），0=无记忆，-1=全部记忆
  visibility: -1  # 可视范围：0=只能看见自己位置，-1=看见全部地图，正数=可视范围
  mazes_path: "mazes/"  # 沙盒使用的迷宫路径
  symbols:  # 迷宫符号配置
    wall: "1"  # 墙壁符号
    path: "0"  # 路径符号
    start: "0"  # 起点符号
    goal: "G"  # 终点符号
    agent: "A"  # 当前位置符号
    masked: "?"  # 不可见区域的mask符号
